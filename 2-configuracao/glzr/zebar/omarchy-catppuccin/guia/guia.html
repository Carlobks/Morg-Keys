<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guia de Atalhos</title>
    <style>
      /* Só fontes instaladas no Windows (Segoe UI e JetBrainsMono NF) e o
         cliente do Zebar em vendor/: o guia não descarrega nada. */

      /* Catppuccin Mocha */
      :root {
        --mauve: #cba6f7;
        --red: #f38ba8;
        --peach: #fab387;
        --green: #a6e3a1;
        --blue: #89b4fa;
        --teal: #94e2d5;
        --yellow: #f9e2af;
        --pink: #f5c2e7;
        --lavender: #b4befe;
        --text: #cdd6f4;
        --subtext0: #a6adc8;
        --overlay0: #6c7086;
        --surface0: #313244;
        --surface1: #45475a;
        --base: #1e1e2e;
        --mantle: #181825;
        --crust: #11111b;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        color: var(--text);
        overflow: hidden;
        user-select: none;
      }

      /* Aberto no navegador (fora do Zebar): fundo e centrado. */
      body.standalone {
        background: var(--crust);
        display: grid;
        place-items: center;
        overflow: auto;
      }

      .card {
        height: 100%;
        max-width: 1300px;
        display: flex;
        flex-direction: column;
        background: var(--base);
        border: 1px solid var(--surface1);
        border-radius: 14px;
        overflow: hidden;
        will-change: transform, opacity, filter;
        /* Fechado = recolhido na chávena (origem da transformação). */
        transform-origin: var(--ox, 0) var(--oy, 0);
        transform: scale(0.03);
        opacity: 0;
        filter: blur(3px);
        transition:
          transform 260ms cubic-bezier(0.5, 0, 0.75, 0),
          opacity 120ms ease-in 140ms,
          filter 260ms ease-in;
      }

      /* Aberto: sai da chávena (visível desde pequeno), viaja na diagonal até
         ao centro com um ligeiro ressalto e ganha nitidez como vapor a assentar. */
      body.open .card {
        transform: none;
        opacity: 1;
        filter: none;
        transition:
          transform 480ms cubic-bezier(0.34, 1.15, 0.5, 1),
          opacity 90ms linear,
          filter 380ms ease-out;
      }

      body.standalone .card {
        height: auto;
        max-height: 96vh;
        margin: 16px;
        transform: none;
        opacity: 1;
        filter: none;
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 22px 14px;
        background: var(--mantle);
        border-bottom: 1px solid var(--surface0);
      }

      header h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        color: var(--mauve);
        letter-spacing: 0.2px;
      }

      header .hint {
        font-size: 12px;
        color: var(--subtext0);
      }

      header input {
        margin-left: auto;
        width: 260px;
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid var(--surface1);
        background: var(--surface0);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        outline: none;
      }

      header input:focus { border-color: var(--mauve); }

      .close {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--subtext0);
        font-size: 14px;
        cursor: pointer;
      }

      .close:hover { background: var(--surface0); color: var(--text); }
      body.standalone .close { display: none; }
      header input::placeholder { color: var(--overlay0); }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 16px 22px 20px;
        display: grid;
        /* 4 colunas num ecrã grande; menos (e desliza) em ecrãs pequenos. O
           tamanho da janela é relativo ao ecrã (zpack.json: 68% x 85%). */
        grid-template-columns: repeat(auto-fit, minmax(285px, 1fr));
        gap: 14px;
        align-items: start;
      }

      .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

      body.standalone main { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

      main::-webkit-scrollbar { width: 8px; }
      main::-webkit-scrollbar-thumb { background: var(--surface1); border-radius: 4px; }

      /* Mesmo estilo do painel Alt+Esc (sistema.html): grupos com a cor do
         tema, ícone em caixinha e a tecla numa caixa escura com contorno. */
      section {
        --c: var(--accent, var(--lavender));
        padding: 10px 10px 6px;
        background: var(--mantle);
        border-radius: 12px;
      }

      section h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 6px 2px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--c);
      }

      .ico {
        width: 24px;
        height: 24px;
        flex: none;
        border-radius: 7px;
        display: grid;
        place-items: center;
        font-family: 'JetBrainsMono NF', monospace;
        font-size: 13px;
        color: var(--c);
        background: color-mix(in srgb, var(--c) 16%, transparent);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 3px 4px;
        border-radius: 7px;
        font-size: 13px;
      }

      .row .ico { width: 22px; height: 22px; font-size: 12px; border-radius: 6px; }
      /* Sem espaço para texto e teclas lado a lado, as teclas descem para a
         linha de baixo (encostadas à direita) em vez de espremer o texto. */
      .row { flex-wrap: wrap; row-gap: 3px; }
      .row .what { flex: 1 1 120px; min-width: 0; color: var(--text); }

      .keys {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
      }

      kbd {
        --k: var(--c, var(--subtext0));
        font-family: 'JetBrainsMono NF', 'Cascadia Mono', Consolas, monospace;
        font-size: 11.5px;
        font-weight: 700;
        line-height: 1;
        display: inline-grid;
        place-items: center;
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        border-radius: 6px;
        color: var(--k);
        background: var(--crust);
        border: 1.5px solid color-mix(in srgb, var(--k) 55%, transparent);
        box-shadow: 0 2px 0 color-mix(in srgb, var(--k) 30%, transparent);
        white-space: nowrap;
      }

      header kbd { --k: var(--subtext0); height: 20px; font-size: 11px; }

      .keys .or {
        font-size: 11px;
        color: var(--overlay0);
        padding: 0 2px;
      }

      .hidden { display: none !important; }

      footer {
        padding: 9px 22px;
        font-size: 11.5px;
        color: var(--overlay0);
        background: var(--mantle);
        border-top: 1px solid var(--surface0);
      }

      footer b { color: var(--subtext0); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <header>
        <h1>Atalhos</h1>
        <span class="hint"><kbd>Alt</kbd> = Super do Omarchy · <kbd>Esc</kbd> fecha</span>
        <input id="filter" type="search" placeholder="Procurar… (ex.: volume, fechar)" autocomplete="off" />
        <button id="close" class="close" title="Fechar (Esc)">✕</button>
      </header>
      <main id="sections"></main>
      <footer class="hidden" id="error"></footer>
    </div>

    <script type="module">
      // Uma linha por atalho: [descrição, teclas, ícone opcional]. "|" separa
      // alternativas, "+" separa teclas da mesma combinação. `icon` (da secção
      // ou da linha) = código Nerd Font da família nf-md (fonte JetBrainsMono NF).
      // `col` = coluna do modal (1 a 4), distribuídas para ficarem equilibradas.
      // Teclas iguais às do Omarchy 4, com Alt no lugar de Super.
      const SECTIONS = [
        {
          // As linhas das apps vêm de apps.txt (ver loadApps); estas ficam fixas.
          title: 'Abrir apps', accent: 'var(--green)', icon: 0xf003b, col: 1, apps: true,
          rows: [
            ['Raycast (lançador)', 'Win'],
            ['Todas as apps (Iniciar)', 'Ctrl+Esc'],
            ['Este guia', 'Alt+K'],
            ['Mudar estes atalhos (painel: Alt+Esc e depois C)', 'Alt+Esc'],
          ],
        },
        {
          title: 'Redimensionar', accent: 'var(--teal)', icon: 0xf0a68, col: 1,
          rows: [
            ['Mais estreita / larga', 'Alt+-|Alt++'],
            ['Mais baixa / alta', 'Alt+Shift+-|Alt+Shift++'],
            ['Modo fino (H J K L ou setas)', 'Alt+R'],
            ['Sair do modo fino', 'Esc|Enter'],
          ],
        },
        {
          title: 'Janelas', accent: 'var(--blue)', icon: 0xf05af, col: 2,
          rows: [
            ['Focar janela ao lado', 'Alt+← ↓ ↑ →'],
            ['Focar (estilo Vim, sem ↑)', 'Alt+H J L'],
            ['Mover janela (ou com setas)', 'Alt+Shift+H J K L'],
            ['Fechar', 'Alt+W|Alt+Q'],
            ['Ecrã inteiro', 'Alt+F'],
            ['Maximizar (mantém a barra)', 'Alt+E'],
            ['Flutuante ↔ mosaico', 'Alt+T'],
            ['Flutuante sempre por cima', 'Alt+O'],
            ['Alternar foco: mosaico / flutuantes', 'Alt+C'],
            ['Minimizar', 'Alt+M'],
            ['Restaurar última minimizada', 'Alt+Shift+M'],
            ['Dividir na outra direção', 'Alt+V'],
            ['Esconder / mostrar a barra', 'Alt+Shift+Space'],
          ],
        },
        {
          title: 'GlazeWM', accent: 'var(--pink)', icon: 0xf0574, col: 2,
          rows: [
            ['Pausar / retomar', 'Alt+Shift+P'],
            ['Recarregar config', 'Alt+Shift+R'],
            ['Redesenhar janelas', 'Alt+Shift+W'],
          ],
        },
        {
          title: 'Workspaces', accent: 'var(--mauve)', icon: 0xf0570, col: 3,
          rows: [
            ['Ir para o workspace', 'Alt+1 … 9|Alt+0'],
            ['Voltar ao anterior', 'Alt+(mesmo nº)|Alt+D'],
            ['Enviar janela e seguir', 'Alt+Shift+1 … 0'],
            ['Seguinte / anterior com janelas', 'Alt+S|Alt+A'],
            ['Scratchpad: mostrar / esconder', 'Alt+º'],
            ['Enviar janela para o scratchpad', 'Alt+Shift+º'],
          ],
        },
        {
          title: 'Sistema — Alt+Esc e depois…', accent: 'var(--red)', icon: 0xf0493, col: 3,
          rows: [
            ['Wi-Fi', 'W', 0xf05a9],
            ['Bluetooth', 'B', 0xf00af],
            ['Som', 'A', 0xf057e],
            ['Ecrã', 'D', 0xf0379],
            ['Luz noturna', 'N', 0xf0594],
            ['Não suspender (chávena)', 'I', 0xf0176],
            ['Gestor de Tarefas', 'T', 0xf0430],
            ['Energia', 'P', 0xf0241],
            ['Bloquear', 'L', 0xf033e],
            ['Apps e arranque (enviar apps para teclas e workspaces)', 'C', 0xf030c],
            ['Gravar arranjo dos workspaces', 'G', 0xf0193],
            ['Animação do arranque: tocar troca · segurar mostra', 'E', 0xf03d8],
            ['Sair do GlazeWM', 'Q', 0xf0206],
            ['Reiniciar (pede confirmação)', 'R', 0xf0709],
            ['Desligar (pede confirmação)', 'O', 0xf0425],
            ['Cancelar', 'Esc|Alt+Esc'],
          ],
        },
        {
          title: 'Barra (rato)', accent: 'var(--peach)', icon: 0xf037d, col: 4,
          rows: [
            ['Menu: Raycast · Terminal', 'Clique|Botão direito'],
            ['Nº do workspace: ir para ele', 'Clique'],
            ['Workspaces: seguinte / anterior', 'Roda'],
            ['Etiqueta tracejada: restaurar', 'Clique'],
            ['Chávena: não suspender', 'Clique'],
            ['Relógio: notificações · formato', 'Clique|Botão direito'],
            ['✻ Claude: página de uso · detalhes', 'Clique|Pairar'],
            ['Volume: definições rápidas', 'Clique'],
            ['Volume ±5 % · silenciar', 'Roda|Botão direito'],
            ['Wi-Fi: escolher rede', 'Clique'],
          ],
        },
        {
          title: 'Windows', accent: 'var(--yellow)', icon: 0xf05b3, col: 4,
          rows: [
            ['Captura de ecrã', 'Alt+Shift+S|Win+Shift+S'],
            ['Notificações', 'Alt+,|Win+N'],
            ['Definições rápidas', 'Win+A'],
            ['Saída de som', 'Win+Ctrl+V'],
            ['Histórico da área de transferência', 'Win+V'],
            ['Emojis', 'Win+.'],
            ['Conta-gotas (PowerToys)', 'Win+Shift+C'],
            ['Copiar texto de imagem (PowerToys)', 'Win+Shift+T'],
            ['Gestor de Tarefas', 'Ctrl+Shift+Esc'],
            ['Bloquear o PC', 'Win+L'],
          ],
        },
        {
          title: 'O Alt rouba às apps', accent: 'var(--overlay0)', icon: 0xf002a, col: 2,
          rows: [
            ['Voltar / avançar no browser', 'botões do rato'],
            ['Barra de endereço (era Alt+D)', 'Ctrl+L'],
            ['Menus das apps (Alt+F, Alt+E)', 'Alt sozinho'],
          ],
        },
      ];

      const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

      function keysHtml(spec) {
        return spec
          .split('|')
          .map(alt => alt
            .replace(/\+\+/g, '+\u0000') // "Alt++" = Alt e a tecla "+"
            .split('+')
            .map(k => `<kbd>${esc(k === '\u0000' ? '+' : k)}</kbd>`)
            .join(''))
          .join('<span class="or">ou</span>');
      }

      const icoHtml = code => (code ? `<span class="ico" data-icon="${code}"></span>` : '');
      const sectionHtml = s =>
        `<section style="--accent:${s.accent}"><h2>${icoHtml(s.icon)}${esc(s.title)}</h2>${s.rows
          .map(
            ([what, keys, icon]) =>
              `<div class="row" data-q="${esc((s.title + ' ' + what + ' ' + keys).toLowerCase())}">` +
              `${icoHtml(icon)}<span class="what">${esc(what)}</span><span class="keys">${keysHtml(keys)}</span></div>`,
          )
          .join('')}</section>`;

      // Ícones centrados a sério (igual ao sistema.html): na fonte
      // "JetBrainsMono NF" cada ícone é mais largo do que a célula e fica
      // desviado, por isso mede-se o desenho real e pinta-se num canvas.
      async function drawIcons(root = document) {
        try { await document.fonts.load('16px "JetBrainsMono NF"'); } catch {}
        for (const el of root.querySelectorAll('.ico[data-icon]')) {
          const size = el.offsetWidth || 24;
          const css = getComputedStyle(el);
          // SVG em vez de canvas: o canvas do WebView2 do Zebar saía às vezes com ícones
          // estragados ou vazios; texto vetorial desenha-se como a barra (sempre certo).
          // Mesma centragem: a origem do texto fica onde o desenho real fica centrado.
          const mctx = document.createElement('canvas').getContext('2d');
          mctx.font = `${css.fontSize} "JetBrainsMono NF"`;
          const ch = String.fromCodePoint(Number(el.dataset.icon));
          const m = mctx.measureText(ch);
          const NS = 'http://www.w3.org/2000/svg';
          const svg = document.createElementNS(NS, 'svg');
          svg.setAttribute('width', size);
          svg.setAttribute('height', size);
          svg.style.display = 'block';
          const tx = document.createElementNS(NS, 'text');
          tx.setAttribute('x', size / 2 - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2);
          tx.setAttribute('y', size / 2 - (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2);
          tx.setAttribute('font-family', 'JetBrainsMono NF');
          tx.setAttribute('font-size', css.fontSize);
          tx.setAttribute('fill', css.color);
          tx.textContent = ch;
          svg.appendChild(tx);
          el.replaceChildren(svg);
          el.removeAttribute('data-icon');
        }
      }

      const main = document.getElementById('sections');
      let appRows = [];

      // Atalhos das apps: lidos de apps.txt ("Alt+Shift+B = Google Chrome"),
      // o mesmo ficheiro que o Alt+Shift+R aplica ao GlazeWM.
      const SPECIAL = {
        terminal: 'Terminal',
        'claude-code': 'Claude Code no terminal',
        explorador: 'Explorador de ficheiros',
        explorer: 'Explorador de ficheiros',
      };
      function appLabel(value) {
        const v = value.trim();
        if (SPECIAL[v.toLowerCase()]) return SPECIAL[v.toLowerCase()];
        if (/^web:/i.test(v)) {
          try { return new URL(v.slice(4).trim()).hostname.replace(/^www\./, ''); } catch { return v; }
        }
        return v.split(/[\\/]/).pop().replace(/\.exe$/i, '');
      }
      async function loadApps() {
        try {
          const res = await fetch(`./apps.txt?t=${Date.now()}`, { cache: 'no-store' });
          const text = await res.text();
          appRows = text.split(/\r?\n/)
            .map(l => l.trim())
            .filter(l => l && !l.startsWith('#') && l.includes('='))
            .map(l => {
              const [keys, ...rest] = l.split('=');
              return [appLabel(rest.join('=')), keys.trim().replace(/\s*\+\s*/g, '+')];
            });
        } catch {
          appRows = [];
        }
        render();
      }

      function render() {
        main.innerHTML = [1, 2, 3, 4]
          .map(c => `<div class="col">${SECTIONS.filter(s => s.col === c)
            .map(s => sectionHtml(s.apps ? { ...s, rows: [...appRows, ...s.rows] } : s))
            .join('')}</div>`)
          .join('');
        filter.dispatchEvent(new Event('input'));
        drawIcons(main);
      }

      // Filtro: esconde linhas (e secções vazias) que não batem com o texto.
      const filter = document.getElementById('filter');
      filter.addEventListener('input', () => {
        const q = filter.value.trim().toLowerCase();
        for (const section of main.querySelectorAll('section')) {
          let visible = 0;
          for (const row of section.querySelectorAll('.row')) {
            const hit = !q || row.dataset.q.includes(q);
            row.classList.toggle('hidden', !hit);
            visible += hit;
          }
          section.classList.toggle('hidden', visible === 0);
        }
      });
      loadApps();

      // No navegador (file: ou ?preview) é uma página normal. No Zebar o guia arranca com o
      // Zebar, fica carregado e escondido; o Alt+K (bar_helper.py) mostra-o e
      // a página anima: sai da chávena da barra e volta para ela ao fechar.
      let close = () => window.close();
      if (location.protocol === 'file:' || new URLSearchParams(location.search).has('preview')) {
        document.body.classList.add('standalone');
      } else {
        // Centro da chávena da barra, em px lógicos do ecrã (a 100% = px reais):
        // fica à esquerda do relógio, no centro da barra (72 px antes do meio).
        const CUP = { x: Math.round(screen.width / 2) - 72, y: 14 };
        const OPEN_MS = 480;
        const CLOSE_MS = 260;
        let win = null;
        let state = 'hidden'; // hidden | open | closing
        let watch = null;
        let closeTimer = null;
        let hideWindow = () => {};

        try {
          // Cliente do Zebar guardado no pack (vendor/): funciona sem internet.
          const zebar = await import('../vendor/zebar-3.3.1.mjs');
          win = zebar.currentWidget().tauriWindow;
          // Esconder passa sempre pelo bar_helper.py (o mesmo que o Alt+K usa
          // para mostrar): um só dono do estado visível/escondido.
          // pyw.exe = lançador oficial do Python: o caminho não muda com atualizações.
          const PYW = 'C:\\Windows\\pyw.exe';
          const HELPER = '{{HOME}}/.glzr/zebar/omarchy-catppuccin/bar_helper.py';
          hideWindow = () => zebar.shellExec(PYW, ['-I', HELPER, 'guide-hide']).catch(console.error);

          // A animação cresce a partir da chávena: a origem da transformação
          // é a posição da chávena relativa a esta janela. outerPosition vem
          // em px físicos; a chávena e o CSS estão em px lógicos.
          const pos = await win.outerPosition();
          const scale = (await win.scaleFactor()) || 1;
          document.documentElement.style.setProperty('--ox', `${CUP.x - pos.x / scale}px`);
          document.documentElement.style.setProperty('--oy', `${CUP.y - pos.y / scale}px`);

          // Só no arranque o Tauri esconde a janela: fica pré-carregada.
          await win.hide();
        } catch (err) {
          console.error('Zebar API indisponível:', err);
          const box = document.getElementById('error'); // só aparece se algo falhar
          box.textContent = `Erro Zebar: ${err?.message ?? err}`;
          box.classList.remove('hidden');
        }

        close = () => {
          if (state !== 'open') return;
          state = 'closing';
          clearInterval(watch);
          document.body.classList.remove('open');
          closeTimer = setTimeout(() => {
            closeTimer = null;
            hideWindow();
            state = 'hidden';
          }, CLOSE_MS);
        };

        // Aparecer: o foco chega quando o Alt+K mostra a janela. Recomeça do
        // estado "dentro da chávena" e anima para fora no frame seguinte.
        window.addEventListener('focus', () => {
          if (state === 'open') return;
          // Esc e logo a seguir Alt+K: cancela o fecho que estava a meio.
          clearTimeout(closeTimer);
          closeTimer = null;
          state = 'open';
          loadApps(); // apps.txt pode ter mudado desde a última vez
          filter.value = '';
          filter.dispatchEvent(new Event('input'));
          main.scrollTop = 0;
          filter.focus();
          document.body.classList.remove('open');
          void document.body.offsetWidth; // aplica o estado inicial antes de animar
          requestAnimationFrame(() => document.body.classList.add('open'));

          // Clicar fora (ou Alt+K, que devolve o foco à janela anterior):
          // o WebView2 não recebe "blur" de forma fiável, por isso pergunta-se
          // à janela se ainda está focada.
          clearInterval(watch);
          const since = performance.now();
          watch = setInterval(async () => {
            if (!win || performance.now() - since < OPEN_MS) return;
            if (!(await win.isFocused())) close();
          }, 120);
        });
      }

      document.getElementById('close').addEventListener('click', () => close());

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          if (filter.value) {
            filter.value = '';
            filter.dispatchEvent(new Event('input'));
          } else {
            close();
          }
        } else if (e.key.length === 1 && document.activeElement !== filter && !e.ctrlKey && !e.altKey) {
          filter.focus(); // escrever em qualquer lado começa a procurar
        }
      });
      filter.focus();
    </script>
  </body>
</html>
